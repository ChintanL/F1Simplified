name: Update F1 data
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch data from OpenF1
        run: node scripts/update.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "f1-bot"
            git config user.email "f1-bot@users.noreply.github.com"
            git add data.json
            git commit -m "Update F1 data"
            git push
          fi
